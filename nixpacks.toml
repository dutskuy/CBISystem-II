[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.curl", "php82Extensions.zip", "php82Extensions.gd"]

[phases.install]
cmds = [
    "mkdir -p /var/log/nginx && mkdir -p /var/cache/nginx",
    "curl -sS https://getcomposer.org/installer | php82 -- --install-dir=/usr/local/bin --filename=composer",
    "composer install --ignore-platform-reqs",
    "npm ci"
]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm run build"
]

[start]
cmd = "php artisan config:clear && php artisan migrate:fresh --seed --force && php artisan storage:link --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"